<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国计量大学校园问答机器人</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #eef2f7;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .chat-box {
      width: 480px; max-width: 95vw; height: 82vh;
      background: #fff; border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.12);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .header {
      background: #0b5fa5; color: #fff; padding: 14px 18px;
      font-size: 17px; font-weight: bold;
    }
    .header small { display: block; font-size: 12px; font-weight: normal; opacity: .85; margin-top: 3px; }
    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #0b5fa5; color: #fff; border-bottom-right-radius: 2px; }
    .msg.bot  { align-self: flex-start; background: #f1f3f5; color: #222; border-bottom-left-radius: 2px; }
    .msg.error { align-self: flex-start; background: #fdecea; color: #b71c1c; }
    .input-bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
    .input-bar input {
      flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    .input-bar input:focus { border-color: #0b5fa5; }
    .input-bar button {
      padding: 0 18px; border: none; border-radius: 8px;
      background: #0b5fa5; color: #fff; font-size: 14px; cursor: pointer;
    }
    .input-bar button:disabled { background: #9bb8d3; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="header">
      中国计量大学校园问答机器人
      <small>只回答与中国计量大学相关的问题</small>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">你好！我是量小智，可以回答中国计量大学相关的问题，请问有什么可以帮你？</div>
    </div>
    <div class="input-bar">
      <input id="input" type="text" placeholder="请输入问题，如：学校有哪些学院？" autocomplete="off" />
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const history = []; // 保存对话历史，用于多轮上下文

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;
      if (text.length > 2000) { addMsg('问题请控制在 2000 字以内。', 'error'); return; }
      inputEl.value = "";
      sendBtn.disabled = true;
      addMsg(text, "user");
      history.push({ role: "user", content: text });
      const thinking = addMsg("思考中…", "bot");

      try {
        const resp = await fetch("https://liangxiaozhi-d7gghiggef22d8751-1511901122.ap-shanghai.app.tcloudbase.com/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history.slice(0, -1).slice(-10) }),
        });
        const data = await resp.json();
        if (resp.ok) {
          thinking.textContent = data.reply;
          history.push({ role: "assistant", content: data.reply });
        } else {
          thinking.textContent = data.error || "请求失败，请稍后再试。";
          thinking.classList.add("error");
        }
      } catch (e) {
        thinking.textContent = "网络错误，无法连接服务器。";
        thinking.classList.add("error");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
